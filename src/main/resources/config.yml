settings:
  timezone: "UTC"        # Zona horaria usada para el reinicio diario
  reset-hour: 0          # Hora local (0-23) a la que se reinician las misiones
  week-start-day: MONDAY       # Día en que se reinician las misiones semanales (MONDAY..SUNDAY)
  hard-quests-enabled: true   # Valor inicial; después manda /quest hard on|off (se guarda en state.yml)

npc:
  name: "&6&lMaestro de Misiones"

# Cuántas misiones de cada dificultad se sortean cada día (misma selección para todos los jugadores)
daily-quests:
  easy: 3
  normal: 3
  hard: 2

# Cuántas misiones SEMANALES se sortean por dificultad (se reinician cada semana)
weekly-quests:
  easy: 1
  normal: 1
  hard: 1

# Las semanales usan los mismos pools de recompensa de su dificultad, pero mejorados:
weekly:
  xp-multiplier: 3.0     # XP x3
  extra-rewards: 2       # +2 premios aleatorios extra
  currency-multiplier: 3.0   # Rincones x3 (solo sobre la cantidad por dificultad)

# ------------------------------------------------------------------------------------------
# MONEDA: se da SIEMPRE al entregar una misión, además de la XP y los premios aleatorios.
# Cantidad por dificultad: número fijo ("5") o rango ("2-4").
# Una misión concreta puede tener su propia cantidad con la clave  coins: "10"  (o "8-12"),
# o en el juego con  /quest reward <id> coins <n|min-max>  (solo misiones creadas con /quest create).
# ------------------------------------------------------------------------------------------
currency:
  enabled: true
  material: AMETHYST_SHARD
  name: "&d&lRincones"
  lore:
    - "&7Moneda de los Rincones"
  amount:
    easy: "2-4"
    normal: "6-10"
    hard: "15-25"

hearts:
  hard-chance: 0.15      # 15% en misiones Difíciles
  event-chance: 1.0      # Misión del evento semanal (1.0 = garantizado)
  max-extra: 10          # Máximo de corazones extra permanentes por jugador

# ------------------------------------------------------------------------------------------
# RECOMPENSAS (sin dinero): XP aleatoria + "count" premios aleatorios del pool (sin repetir).
# Cada premio: item, amount (número o rango "8-16"), weight (más peso = más probable),
# enchants (opcional, "nombre:nivel"; admite niveles por encima del máximo vanilla).
# ------------------------------------------------------------------------------------------
rewards:
  easy:
    xp: "60-120"
    count: 2
    description: "Minerales y comida"
    pool:
      - {item: IRON_INGOT, amount: "8-16", weight: 4}
      - {item: GOLD_INGOT, amount: "4-8", weight: 2}
      - {item: COPPER_INGOT, amount: "16-32", weight: 1}
      - {item: COAL, amount: "16-32", weight: 2}
      - {item: REDSTONE, amount: "16-32", weight: 1}
      - {item: LAPIS_LAZULI, amount: "8-16", weight: 1}
      - {item: COOKED_BEEF, amount: "12-24", weight: 4}
      - {item: COOKED_PORKCHOP, amount: "12-24", weight: 3}
      - {item: BREAD, amount: "16-32", weight: 2}
      - {item: BAKED_POTATO, amount: "16-24", weight: 2}
      - {item: GOLDEN_CARROT, amount: "8-16", weight: 1}
      - {item: EXPERIENCE_BOTTLE, amount: "4-8", weight: 1}

  normal:
    xp: "150-300"
    count: 2
    description: "Ítems útiles y libros encantados"
    pool:
      - {item: DIAMOND, amount: "1-3", weight: 3}
      - {item: GOLDEN_APPLE, amount: "1-3", weight: 4}
      - {item: EMERALD, amount: "4-8", weight: 2}
      - {item: ENDER_PEARL, amount: "4-8", weight: 2}
      - {item: EXPERIENCE_BOTTLE, amount: "16-32", weight: 3}
      - {item: ARROW, amount: "32-64", weight: 1}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["protection:3"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["sharpness:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["efficiency:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["unbreaking:3"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["feather_falling:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["fortune:3"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["looting:3"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["power:4"]}

  hard:
    xp: "400-800"
    count: 2
    description: "Manzanas de oro encantadas y libros de nivel máximo"
    pool:
      - {item: ENCHANTED_GOLDEN_APPLE, amount: "1-2", weight: 5}
      - {item: DIAMOND, amount: "4-8", weight: 3}
      - {item: NETHERITE_SCRAP, amount: "2-4", weight: 2}
      - {item: NETHERITE_INGOT, amount: 1, weight: 1}
      - {item: TOTEM_OF_UNDYING, amount: 1, weight: 2}
      - {item: EXPERIENCE_BOTTLE, amount: "32-64", weight: 2}
      - {item: DIAMOND_CHESTPLATE, amount: 1, weight: 1, enchants: ["protection:4", "unbreaking:3", "mending:1"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 4, enchants: ["protection:5"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["protection:6"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["blast_protection:5"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["projectile_protection:5"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 3, enchants: ["sharpness:6"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 3, enchants: ["efficiency:6"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 3, enchants: ["unbreaking:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 3, enchants: ["mending:1"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["fortune:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["looting:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 2, enchants: ["power:6"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["thorns:4"]}
      - {item: ENCHANTED_BOOK, amount: 1, weight: 1, enchants: ["feather_falling:5"]}

